<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Command Center | Ahmed Mohamed</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #58a6ff; --bg: #0d1117; --card-bg: #161b22; --border: #30363d; }
        body { margin: 0; background-color: var(--bg); color: #c9d1d9; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        .dashboard { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
        
        /* Sidebar Styles */
        .sidebar { background: var(--card-bg); border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; }
        .sidebar h2 { color: var(--primary); font-size: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .team-link { 
            padding: 15px; margin-bottom: 10px; border-radius: 8px; border: 1px solid var(--border); 
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 10px;
        }
        .team-link:hover { background: #21262d; border-color: var(--primary); }
        .status { width: 8px; height: 8px; border-radius: 50%; background: #238636; }

        /* Main Content */
        .main-view { position: relative; display: flex; flex-direction: column; }
        #globe-3d { flex-grow: 1; background: #000; }

        /* Floating Info Panel */
        .info-panel {
            position: absolute; bottom: 20px; right: 20px; background: rgba(22, 27, 34, 0.9);
            border: 1px solid var(--primary); padding: 20px; border-radius: 12px; width: 350px;
            backdrop-filter: blur(10px); display: none; z-index: 1000;
        }
        
        .header { padding: 20px; background: var(--card-bg); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .badge { background: #388bfd26; color: var(--primary); padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="sidebar">
        <h2>GLOBAL LOCATIONS</h2>
        <div class="team-link" onclick="flyTo(30.04, 31.23, 'Cairo HQ', 'Sarah Ahmed - Operations Manager')">
            <div class="status"></div> <span>Cairo HQ (Egypt)</span>
        </div>
        <div class="team-link" onclick="flyTo(51.50, -0.12, 'London Branch', 'James Wilson - Tech Lead')">
            <div class="status"></div> <span>London Office (UK)</span>
        </div>
        <div class="team-link" onclick="flyTo(35.67, 139.65, 'Tokyo Team', 'Yuki Sato - Design Director')">
            <div class="status"></div> <span>Tokyo Creative (Japan)</span>
        </div>
        
        <h2 style="margin-top: 30px;">SESSION INFO</h2>
        <p style="font-size: 0.8rem; color: #8b949e;">Leading Virtual Teams Presentation</p>
        <div class="badge">Presenter: Ahmed Mohamed</div>
    </div>

    <div class="main-view">
        <div class="header">
            <div style="font-weight: bold;">VIRTUAL COMMAND INTERFACE v2.5</div>
            <div id="clock"></div>
        </div>
        <div id="globe-3d"></div>
        
        <div id="info-panel" class="info-panel">
            <h3 id="panel-city" style="margin: 0; color: var(--primary);">City Name</h3>
            <p id="panel-lead" style="font-size: 0.9rem; color: #fff; margin: 10px 0;">Team Lead Info</p>
            <hr style="border: 0; border-top: 1px solid var(--border);">
            <p style="font-size: 0.8rem; color: #8b949e;">Active Projects: Q2 Virtual Scaling, Data Visualization Hub.</p>
        </div>
    </div>
</div>

<script>
    // 3D Globe Data
    var data = [{
        type: 'scattergeo',
        lon: [31.23, -0.12, 139.65],
        lat: [30.04, 51.50, 35.67],
        text: ['Cairo', 'London', 'Tokyo'],
        mode: 'markers+lines',
        marker: { size: 12, color: '#58a6ff', symbol: 'diamond', line: {width: 2, color: '#fff'} },
        line: { width: 2, color: '#00ffcc', opacity: 0.5 }
    }];

    var layout = {
        geo: { 
            projection: { type: 'orthographic' }, 
            bgcolor: '#0d1117', showland: true, landcolor: '#21262d',
            showocean: true, oceancolor: '#0d1117'
        },
        paper_bgcolor: 'rgba(0,0,0,0)',
        margin: { l: 0, r: 0, t: 0, b: 0 }
    };

    Plotly.newPlot('globe-3d', data, layout, {responsive: true});

    function flyTo(lat, lon, city, lead) {
        var update = {
            'geo.center.lat': lat,
            'geo.center.lon': lon,
            'geo.projection.scale': 2.5
        };
        Plotly.relayout('globe-3d', update);
        
        document.getElementById('info-panel').style.display = 'block';
        document.getElementById('panel-city').innerText = city;
        document.getElementById('panel-lead').innerText = "Team Lead: " + lead;
    }

    // Live Clock
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>

</body>
</html>
